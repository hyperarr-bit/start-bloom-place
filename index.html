<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Core</title>
    <meta name="description" content="Core: Organize sua vida">
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="light dark" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preload" as="video" href="/videos/app-preview.mp4" type="video/mp4" fetchpriority="high" />
    <link rel="preload" as="image" href="/videos/app-preview-poster.jpg" type="image/jpeg" />
    <script>
      // Apply theme BEFORE React mounts to prevent FOUC (flash of light theme).
      // Keep palette table in sync with src/hooks/use-theme.tsx (paletteVars).
      (function () {
        try {
          var mode = localStorage.getItem("core-theme-mode") || "light";
          var palette = localStorage.getItem("core-theme-palette") || "default";
          var root = document.documentElement;
          if (mode === "dark") root.classList.add("dark");

          var P = {
            midnight: {
              light: { "--background": "230 25% 95%", "--foreground": "230 50% 10%" },
              dark:  { "--background": "230 30% 8%",  "--foreground": "230 10% 90%" }
            },
            ocean: {
              light: { "--background": "200 30% 97%", "--foreground": "200 50% 10%" },
              dark:  { "--background": "200 30% 7%",  "--foreground": "200 10% 92%" }
            },
            rose: {
              light: { "--background": "350 30% 97%", "--foreground": "350 40% 10%" },
              dark:  { "--background": "350 25% 7%",  "--foreground": "350 10% 92%" }
            },
            forest: {
              light: { "--background": "140 25% 96%", "--foreground": "140 40% 10%" },
              dark:  { "--background": "140 25% 6%",  "--foreground": "140 10% 92%" }
            },
            default: {
              light: { "--background": "39 38% 93%",  "--foreground": "0 0% 10%" },
              dark:  { "--background": "222 16% 7%",  "--foreground": "0 0% 95%" }
            }
          };
          var vars = (P[palette] && P[palette][mode]) || P.default[mode];
          var bg = vars["--background"];
          var fg = vars["--foreground"];
          root.style.setProperty("--background", bg);
          root.style.setProperty("--foreground", fg);
          // Paint background immediately so first frame is correct.
          root.style.backgroundColor = "hsl(" + bg + ")";
          root.style.color = "hsl(" + fg + ")";
        } catch (e) {}
      })();
    </script>

    
    
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/F1UaP3X4LuVRGjf4H2EaP2J25Jf2/social-images/social-1775703057282-Green_and_Brown_Minimalist_Studio_Logo_Design_Template.webp">

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/F1UaP3X4LuVRGjf4H2EaP2J25Jf2/social-images/social-1775703057282-Green_and_Brown_Minimalist_Studio_Logo_Design_Template.webp">
    <meta property="og:title" content="Core">
  <meta name="twitter:title" content="Core">
  <meta property="og:description" content="Core: Organize sua vida">
  <meta name="twitter:description" content="Core: Organize sua vida">
</head>

  <body>
    <div id="root">
      <!--
        Splash estático para /inicio: evita o "flash bege" entre o paint do
        HTML e a montagem do React. É substituído assim que o React renderiza
        a WelcomeScreen. NÃO mexe no autoplay/toque do vídeo (o <video> só
        aparece depois, dentro do componente React).
      -->
      <script>
        (function () {
          try {
            if (location.pathname !== "/inicio") return;
            var root = document.getElementById("root");
            if (!root) return;
            root.innerHTML =
              '<div id="initial-splash" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:hsl(var(--background));padding:24px;">' +
                '<div style="position:relative;aspect-ratio:9/19.5;height:min(62dvh,620px);max-width:82vw;border-radius:18%/8.5%;padding:1.2%;background:linear-gradient(135deg,#d8d8db 0%,#f4f4f6 18%,#b9b9bd 38%,#e9e9ec 58%,#a8a8ac 82%,#cfcfd3 100%);box-shadow:0 30px 60px -20px rgba(0,0,0,.45),0 12px 24px -10px rgba(0,0,0,.25);">' +
                  '<div style="position:relative;width:100%;height:100%;border-radius:16.5%/7.8%;background:#050507;padding:1.4%;">' +
                    '<div style="position:relative;width:100%;height:100%;border-radius:15.5%/7.3%;overflow:hidden;background:#000;">' +
                      '<img src="/videos/app-preview-poster.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;" draggable="false" />' +
                    '</div>' +
                  '</div>' +
                '</div>' +
              '</div>';
          } catch (e) {}
        })();
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
