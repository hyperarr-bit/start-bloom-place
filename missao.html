<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CORE · O que mais atrapalha você hoje?</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!--
      FUNIL DA MISSÃO (protótipo 18/10) — a 1ª tela em HTML PURO.
      Nada de React, fonte remota, pixel ou imagem antes dela: o HTML chega e a pergunta já está pintada
      (o /hoje e o /assinatura esperam o bundle inteiro, ~3–4 s em 4G). O app de verdade (React + o tutorial
      da missão) carrega em SEGUNDO PLANO enquanto a pessoa lê as telas 1 e 2 (src/missao/leve.ts) e monta
      no MESMO documento (sem recarregar) quando ela toca no botão da tela 2.
      Uma única animação de troca de tela no funil inteiro: .mt-tela / @keyframes mt-entra (a mesma do /hoje,
      fn-entra: 14 px da direita + fade, 280 ms) — o React usa a mesma (src/missao/missao.css).
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin />
    <style>
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 300 900; font-display: swap; src: url(/fonts/inter-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      :root { --mt-texto: #262626; --mt-suave: #6b6b6b; --mt-borda: #e9e7e3; --mt-papel: #faf8f5; --mt-grafite: #262626; --mt-magenta: #d6338a; --mt-magenta-suave: #fdf0f6; }
      html, body { margin: 0; background: #fff; color: var(--mt-texto); font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
      * { box-sizing: border-box; }
      #mt { position: fixed; inset: 0; top: 0; right: 0; bottom: 0; left: 0; z-index: 400; display: flex; flex-direction: column; background: #fff; overflow-y: auto; -webkit-overflow-scrolling: touch; }
      #mt[hidden] { display: none; }
      .mt-tela { display: flex; flex-direction: column; flex: 1 0 auto; min-height: 100%; animation: mt-entra .28s ease-out both; }
      .mt-tela[hidden] { display: none; }
      @keyframes mt-entra { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .mt-tela { animation: none; } }

      .mt-topo { display: flex; align-items: center; gap: 10px; padding: 14px 20px 0; min-height: 46px; }
      .mt-marca { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; letter-spacing: .16em; }
      .mt-marca i { width: 7px; height: 7px; border-radius: 50%; background: var(--mt-magenta); }
      .mt-topo-dir { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--mt-suave); }
      button.mt-voltar { display: inline-flex; align-items: center; gap: 2px; margin-left: -8px; padding: 6px 8px; background: none; border: 0; color: var(--mt-suave); font: 600 14px/1 inherit; font-family: inherit; }
      .mt-barra { display: flex; gap: 6px; padding: 16px 20px 0; }
      .mt-barra i { flex: 1; height: 4px; border-radius: 4px; background: #f0eeeb; }
      .mt-barra i.on { background: var(--mt-magenta); }

      .mt-q { padding: 18px 20px 0; }
      .mt-kicker { font-size: 11.5px; letter-spacing: .1em; font-weight: 800; color: var(--mt-magenta); text-transform: uppercase; }
      .mt-q h1 { font-size: 30px; font-weight: 800; letter-spacing: -.025em; line-height: 1.08; margin: 6px 0 0; }
      .mt-q p { font-size: 15.5px; color: var(--mt-suave); margin: 10px 0 0; line-height: 1.42; }

      .mt-ops { display: flex; flex-direction: column; gap: 10px; padding: 20px 20px 0; }
      button.mt-op { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 66px; padding: 10px 14px 10px 12px; border-radius: 18px; border: 1.5px solid var(--mt-borda); background: #fff; color: var(--mt-texto); text-align: left; font-family: inherit; box-shadow: 0 1px 0 rgba(0,0,0,.03); transition: border-color .12s, background-color .12s, transform .1s; cursor: pointer; }
      button.mt-op:active { transform: scale(.985); }
      button.mt-op.on { border-color: var(--mt-magenta); background: var(--mt-magenta-suave); }
      .mt-op-ico { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; font-size: 22px; flex-shrink: 0; }
      .mt-op-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .mt-op-txt b { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
      .mt-op-txt span { font-size: 13.5px; color: var(--mt-suave); }
      .mt-op svg { margin-left: auto; color: #bdbdbd; flex-shrink: 0; }
      .mt-confia { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 18px 20px max(18px, env(safe-area-inset-bottom)); margin-top: auto; font-size: 13px; font-weight: 600; color: var(--mt-suave); }

      /* tela 2 */
      .mt-dor { margin: 18px 20px 0; padding: 16px; border-radius: 18px; background: var(--mt-papel); }
      .mt-dor-tit { font-size: 11.5px; letter-spacing: .1em; font-weight: 800; color: var(--mt-suave); text-transform: uppercase; }
      .mt-passos { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
      .mt-passos li { display: flex; align-items: center; gap: 12px; font-size: 15.5px; font-weight: 600; line-height: 1.3; }
      .mt-passos li em { font-style: normal; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; background: #fff; border: 1.5px solid var(--mt-borda); flex-shrink: 0; }
      .mt-passos li:first-child em { background: var(--mt-grafite); color: #fff; border-color: var(--mt-grafite); }
      .mt-passos li { animation: mt-entra .28s ease-out backwards; }
      .mt-passos li:nth-child(2) { animation-delay: .09s; } .mt-passos li:nth-child(3) { animation-delay: .18s; }
      @media (prefers-reduced-motion: reduce) { .mt-passos li { animation: none; } }
      .mt-passos li small { display: block; font-size: 13px; font-weight: 500; color: var(--mt-suave); margin-top: 1px; }
      .mt-rodape { position: sticky; bottom: 0; margin-top: auto; padding: 16px 20px max(14px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; background: linear-gradient(to bottom, rgba(255,255,255,0) 0, #fff 18px); }
      button.mt-cta { width: 100%; min-height: 56px; border-radius: 16px; border: 0; background: var(--mt-grafite); color: #fff; font-size: 16.5px; font-weight: 750; font-family: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.14); transition: transform .1s; cursor: pointer; }
      button.mt-cta:active { transform: scale(.985); }
      .mt-sub { text-align: center; font-size: 13px; font-weight: 600; color: var(--mt-suave); }

      /* tela "abrindo" (só aparece se o app ainda não chegou) */
      .mt-abrindo { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 40px 28px; text-align: center; }
      .mt-abrindo b { font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
      .mt-abrindo span { font-size: 14px; color: var(--mt-suave); }
      .mt-progresso { width: 160px; height: 5px; border-radius: 5px; background: #f0eeeb; overflow: hidden; }
      .mt-progresso i { display: block; height: 100%; width: 35%; border-radius: 5px; background: var(--mt-magenta); animation: mt-vai 1.1s ease-in-out infinite; }
      @keyframes mt-vai { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
    </style>
  </head>
  <body>
    <div id="mt">
      <!-- TELA 1 — pintada pelo HTML, antes de qualquer JS -->
      <section class="mt-tela" id="mt-t1" data-tela="dor">
        <div class="mt-topo"><span class="mt-marca"><i></i>CORE</span><span class="mt-topo-dir">1 minuto · grátis</span></div>
        <div class="mt-q">
          <h1>O que mais atrapalha você hoje?</h1>
          <p>Toque em uma. O CORE abre aqui mesmo e começa por ela, sem cadastro.</p>
        </div>
        <div class="mt-ops" role="list">
          <button type="button" class="mt-op" data-area="dinheiro" role="listitem"><span class="mt-op-ico" style="background:#fef3c7">💸</span><span class="mt-op-txt"><b>Dinheiro</b><span>Acaba antes do fim do mês</span></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
          <button type="button" class="mt-op" data-area="rotina" role="listitem"><span class="mt-op-ico" style="background:#fce7f3">⏰</span><span class="mt-op-txt"><b>Rotina</b><span>O dia passa e nada anda</span></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
          <button type="button" class="mt-op" data-area="corpo" role="listitem"><span class="mt-op-ico" style="background:#dbeafe">💪</span><span class="mt-op-txt"><b>Corpo e saúde</b><span>Começo e paro toda semana</span></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
          <button type="button" class="mt-op" data-area="metas" role="listitem"><span class="mt-op-ico" style="background:#ede9fe">🎯</span><span class="mt-op-txt"><b>Metas</b><span>Fico só na vontade</span></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
          <button type="button" class="mt-op" data-area="tudo" role="listitem"><span class="mt-op-ico" style="background:#dcfce7">🧩</span><span class="mt-op-txt"><b>Tudo um pouco</b><span>Minha vida tá uma bagunça</span></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
        </div>
        <div class="mt-confia"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Grátis · sem cadastro · sem baixar nada</div>
      </section>

      <!-- TELA 2 — preenchida pelo leve.ts com o texto da área -->
      <section class="mt-tela" id="mt-t2" data-tela="ponte" hidden>
        <div class="mt-topo"><button type="button" class="mt-voltar" id="mt-voltar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg><span>Voltar</span></button><span class="mt-topo-dir"><span class="mt-marca" style="font-size:12px"><i></i>CORE</span></span></div>
        <div class="mt-q">
          <div class="mt-kicker" id="mt-kicker"></div>
          <h1 id="mt-h1"></h1>
          <p id="mt-p"></p>
        </div>
        <div class="mt-dor">
          <div class="mt-dor-tit" id="mt-dor-tit">Agora, no app</div>
          <ol class="mt-passos" id="mt-passos"></ol>
        </div>
        <div class="mt-rodape">
          <button type="button" class="mt-cta" id="mt-cta"><span id="mt-cta-txt">Começar</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
          <div class="mt-sub">Abre aqui mesmo · sem cadastro</div>
        </div>
      </section>

      <!-- "Abrindo seu CORE…" — só se a pessoa tocar antes de o app terminar de chegar -->
      <section class="mt-tela" id="mt-t3" data-tela="abrindo" hidden>
        <div class="mt-abrindo"><span class="mt-marca"><i></i>CORE</span><b id="mt-abrindo-tit">Abrindo seu CORE…</b><div class="mt-progresso"><i></i></div><span>Só um instante.</span></div>
      </section>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/missao/leve.ts"></script>
  </body>
</html>
