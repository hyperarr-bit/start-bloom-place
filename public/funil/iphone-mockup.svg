<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 880" width="430" height="880" fill="none">
  <!-- iPhone 15/16 Pro, visto de frente: moldura de titânio fininha (3), bezel preto (7), tela TRANSPARENTE
       (o vídeo fica por baixo), Dynamic Island discreta e os botões laterais. Desenhado a 430×880
       (430 = 402 pt da tela + 2×14 de borda); escala com a largura. -->
  <defs>
    <linearGradient id="ti" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9d5ce"/>
      <stop offset="0.5" stop-color="#b9b4ad"/>
      <stop offset="1" stop-color="#8f8a84"/>
    </linearGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- botões laterais (atrás da moldura) -->
  <rect x="-2.5" y="186" width="5" height="34" rx="2" fill="#9d9892"/>
  <rect x="-2.5" y="248" width="5" height="60" rx="2" fill="#9d9892"/>
  <rect x="-2.5" y="322" width="5" height="60" rx="2" fill="#9d9892"/>
  <rect x="427.5" y="276" width="5" height="92" rx="2" fill="#9d9892"/>
  <!-- moldura de titânio (anel de 3): rect externo menos rect interno -->
  <path fill="url(#ti)" fill-rule="evenodd" d="M68 0 H362 A68 68 0 0 1 430 68 V812 A68 68 0 0 1 362 880 H68 A68 68 0 0 1 0 812 V68 A68 68 0 0 1 68 0 Z M68 3 A65 65 0 0 0 3 68 V812 A65 65 0 0 0 68 877 H362 A65 65 0 0 0 427 812 V68 A65 65 0 0 0 362 3 Z"/>
  <!-- bezel preto (anel de 7): do rect de 3 até o rect da tela em 10 -->
  <path fill="#0b0b0d" fill-rule="evenodd" d="M68 3 H362 A65 65 0 0 1 427 68 V812 A65 65 0 0 1 362 877 H68 A65 65 0 0 1 3 812 V68 A65 65 0 0 1 68 3 Z M68 10 A58 58 0 0 0 10 68 V812 A58 58 0 0 0 68 870 H362 A58 58 0 0 0 420 812 V68 A58 58 0 0 0 362 10 Z"/>
  <!-- brilho sutil no topo da moldura -->
  <path fill="url(#brilho)" fill-rule="evenodd" d="M68 0 H362 A68 68 0 0 1 430 68 V140 H0 V68 A68 68 0 0 1 68 0 Z M68 3 A65 65 0 0 0 3 68 V140 H427 V68 A65 65 0 0 0 362 3 Z"/>
  <!-- Dynamic Island (discreta) -->
  <rect x="155" y="22" width="120" height="34" rx="17" fill="#0b0b0d"/>
  <circle cx="251" cy="39" r="5.5" fill="#1b1b22"/>
  <circle cx="251" cy="39" r="2.4" fill="#2a2f45"/>
</svg>
