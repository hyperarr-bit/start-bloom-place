apply plugin: 'com.android.application'

// Assinatura de release: chave de UPLOAD em ~/android-toolchain/keystore
// (fora do repo; senha em key.properties, gitignored). O Play App Signing
// gerencia a chave final — esta é só a de upload, recuperável pelo console.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "br.com.coreaplicativo.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "br.com.coreaplicativo.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // O Play recusa reenviar o mesmo versionCode: 1, 2 e 3 já foram pro
        // teste interno, então todo upload novo sobe este número.
        versionCode 84
        versionName "1.0.83"
        // Client token da Meta: fora do código versionado (repo é PÚBLICO —
        // ver comentário no strings.xml). Ausente, o recurso nasce vazio e a
        // MainActivity simplesmente não liga o SDK; o preparar-loja barra
        // build de produção nessa situação.
        resValue "string", "facebook_client_token",
                 (keystoreProperties['metaClientToken'] ?: "")
        // Credenciais do TikTok: mesma regra do client token da Meta — fora
        // do código versionado (repo é PÚBLICO), vivem no key.properties.
        // Ausentes, o SDK do TikTok simplesmente não liga (MainActivity).
        resValue "string", "tiktok_app_id",
                 (keystoreProperties['tiktokAppId'] ?: "")
        resValue "string", "tiktok_app_secret",
                 (keystoreProperties['tiktokAppSecret'] ?: "")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // SDK da Meta (12/08, decisão do dono — reverte a política "sem rastreador
    // no binário"): sem ele a Meta não mede instalação nem compra do app, e
    // campanha de App Promotion otimiza no escuro. facebook-core é o módulo
    // mínimo (App Events) — sem Login, sem Share, sem Audience Network.
    implementation 'com.facebook.android:facebook-core:18.3.0'
    // GAID pro CAPI do servidor: a compra fecha com o app FECHADO (Pix pago
    // horas depois), então quem manda o Purchase é o servidor — e o madid é
    // o que deixa a Meta casar essa compra com o clique no anúncio.
    implementation 'com.google.android.gms:play-services-ads-identifier:18.1.0'
    // SDK do TikTok (16/08, decisão do dono — mesma lógica do da Meta acima):
    // sem ele o TikTok não enxerga a instalação e a campanha de app roda
    // cega. InstallApp/LaunchApp automáticos; Purchase continua saindo SÓ do
    // servidor (Events API, dedup por tx) — auto-IAP desligado no init.
    implementation 'com.github.tiktok:tiktok-business-android-sdk:1.7.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
